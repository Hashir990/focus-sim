<!-- ============ REST ARCADE OVERLAY ============ -->
<div class="overlay hide" id="overlay">
  <div class="ov-head">
    <button class="ov-back" id="ov-back" aria-label="Back to timer">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="ov-title" id="ov-title">Rest arcade</div>
    <div class="ov-timer" id="ov-timer">00:00</div>
  </div>
  <div class="ov-focus-wrap"><button class="ov-focus" id="ov-focus">Back to focusing →</button></div>
  <div class="ov-body">

    <!-- picker -->
    <div class="picker" id="picker">
      <p class="pick-lede">A small, unhurried puzzle for your break. Your progress waits here for the next one.</p>
      <button class="pcard" data-game="sudoku">
        <span class="emoji">▦</span>
        <span><h3>Sudoku</h3><p>Fill the grid across several breaks. Notes, conflict-checking, one true solution.</p></span>
        <span class="prog" id="prog-sudoku"></span>
      </button>
      <button class="pcard" data-game="wordle">
        <span class="emoji">◐</span>
        <span><h3>Word guess</h3><p>Six tries to find the hidden five-letter word. Quick, satisfying, break-sized.</p></span>
        <span class="prog" id="prog-wordle"></span>
      </button>
    </div>
