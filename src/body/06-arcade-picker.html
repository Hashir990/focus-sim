<!-- ============ REST ARCADE OVERLAY ============ -->
<div class="overlay hide" id="overlay">
  <div class="ov-head">
    <button class="ov-back" id="ov-back" aria-label="Back to timer">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <!-- The menu, without leaving whatever you're in the middle of. The edge
         swipe does the same thing, but a gesture you can't see is no use to
         somebody who doesn't know it's there — and on the two boards that drag
         with a finger, this is the only way in. -->
    <button class="ov-menu" id="ov-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div class="ov-title" id="ov-title">Rest arcade</div>
    <!-- The way into a game's back catalogue. Shown only while a game with
         dated editions is open — see `registerDaily` in 09b-daily.js — because
         2048 and chess have no dates to browse. -->
    <button class="ov-cal hide" id="ov-cal" aria-label="Puzzle calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
      </svg>
    </button>
    <button class="chat-btn hide" id="chat-btn-ov" aria-label="Messages">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"></path>
      </svg>
      <span class="chat-dot hide" id="chat-dot-ov"></span>
    </button>
    <div class="ov-timer" id="ov-timer">00:00</div>
  </div>
  <div class="ov-focus-wrap"><button class="ov-focus" id="ov-focus">Back to focusing →</button></div>
  <div class="ov-body">

    <!-- picker -->
    <div class="picker" id="picker">
      <div class="pick-group"><h4>On your own</h4><em>one a day</em></div>
      <button class="pcard" data-game="sudoku">
        <span class="emoji">▦</span>
        <span><h3>Sudoku</h3><p>One grid a day, in three difficulties.</p></span>
        <span class="prog" id="prog-sudoku"></span>
      </button>
      <button class="pcard" data-game="wordle">
        <span class="emoji">◐</span>
        <span><h3>Word guess</h3><p>Five letters, six tries. Everyone gets the same word.</p></span>
        <span class="prog" id="prog-wordle"></span>
      </button>
      <button class="pcard" data-game="g2048">
        <span class="emoji">◈</span>
        <span><h3>2048</h3><p>Slide the tiles together and watch the numbers climb.</p></span>
        <span class="prog" id="prog-2048"></span>
      </button>
      <button class="pcard" data-game="crossword">
        <span class="emoji">▤</span>
        <span><h3>Crossword</h3><p>Small ones daily, a big one on Sundays.</p></span>
        <span class="prog" id="prog-crossword"></span>
      </button>
      <div class="pick-group"><h4>Together</h4><em>needs a room</em></div>
      <button class="pcard needs-room" data-game="hangman">
        <span class="emoji">⌇</span>
        <span><h3>Hangman<em class="tag">2+</em></h3><p>One sets a word, the rest guess.</p></span>
        <span class="prog" id="prog-hangman"></span>
      </button>
      <button class="pcard needs-room" data-game="scrabble">
        <span class="emoji">▩</span>
        <span><h3>Scrabble<em class="tag">2+</em></h3><p>The full board, taking turns.</p></span>
        <span class="prog" id="prog-scrabble"></span>
      </button>
      <button class="pcard needs-room" data-game="chess">
        <span class="emoji">♞</span>
        <span><h3>Chess<em class="tag">2</em></h3><p>Keeps its place between breaks.</p></span>
        <span class="prog" id="prog-chess"></span>
      </button>
      <button class="pcard needs-room" data-game="pictionary">
        <span class="emoji">✎</span>
        <span><h3>Pictionary<em class="tag">2+</em></h3><p>One draws, everyone else shouts.</p></span>
        <span class="prog" id="prog-pictionary"></span>
      </button>
      <!-- Memory is disabled — see MEMORY_ENABLED in src/js/23-memory.js
      <button class="pcard" data-game="memory">
        <span class="emoji">❖</span>
        <span><h3>Memory</h3><p>Turn over eight matching pairs. Gentle, and over in a minute or two.</p></span>
        <span class="prog" id="prog-memory"></span>
      </button>
      -->
    </div>
