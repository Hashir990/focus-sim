    <!-- sudoku -->
    <div class="game hide" id="game-sudoku">
      <div class="game-top">
        <span class="gname">Sudoku</span>
        <span class="meta" id="sdk-meta"></span>
        <!-- Days in a row, painted by `dailyStreakPaint` in 09b-daily.js.
             Hidden at zero: a streak of none is not a thing to announce. -->
        <span class="streak hide" id="sdk-streak"></span>
        <button class="mini-btn" id="sdk-new">New</button>
      </div>
      <div class="sdk" id="sdk-grid"></div>
      <div class="numpad" id="sdk-pad"></div>
      <!-- What happens when you put it down. People close a puzzle and wonder,
           and the answer is good news, so it should not be a secret. -->
      <p class="game-note">The grid is kept as you go. Close it while you are signed in and it goes with you to your other devices.</p>
      <div class="banner hide" id="sdk-banner"><h3>Solved.</h3><p id="sdk-win-sub"></p><button class="mini-btn" id="sdk-again">History</button></div>
    </div>
