<!-- ============ ABOUT: PRIVACY AND CREDITS ============
     One overlay, two things to read. They are the same shape — a title and some
     prose — and two overlays would have been the same markup twice with a
     different id on it. `aboutOpen(which)` in 50-about.js fills it. -->
<div class="overlay hide" id="about-overlay">
  <div class="ov-head">
    <button class="ov-back" id="about-back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="ov-title" id="about-title">About</div>
    <div style="width:40px"></div>
  </div>
  <div class="ov-body">
    <div class="about" id="about-body"></div>
  </div>
</div>
