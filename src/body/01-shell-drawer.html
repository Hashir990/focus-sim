<div class="app" id="app">
  <div class="drawer-backdrop hide" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="drawer-x" id="drawer-close" aria-label="Close menu">×</button>
    </div>
    <button class="drawer-item" id="d-quotes">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>
      <span><b>Quote bank</b><small>Lines that fade in while you focus</small></span>
    </button>
    <button class="drawer-item" id="d-history">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span><b>History</b><small>Your sessions &amp; notes calendar</small></span>
    </button>
    <button class="drawer-item" id="d-stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span><b>Your focus</b><small>Totals, streaks and your best hours</small></span>
    </button>
    <button class="drawer-item" id="d-sync">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span><b>Focus together</b><small>Share a timer with someone else</small></span>
    </button>
    <div class="drawer-sec">Ambience</div>
    <div class="amb-grid" id="amb-grid"></div>
    <div class="amb-vol-row hide" id="amb-vol-row">
      <span>Volume</span>
      <input type="range" id="amb-vol" min="0" max="100" value="55" aria-label="Ambience volume" />
    </div>

    <div class="drawer-sec">Settings</div>
    <div class="drawer-toggles">
      <button class="toggle on" id="t-auto"><span class="dot"></span>Auto‑continue</button>
      <button class="toggle on" id="t-sound"><span class="dot"></span>Chime</button>
    </div>
    <div class="drawer-sec">Your data</div>
    <div class="drawer-toggles">
      <button class="toggle" id="d-export"><span class="dot"></span>Export backup</button>
      <button class="toggle" id="d-import"><span class="dot"></span>Import backup</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div class="drawer-foot">Focus Simulator · your data stays on this device<br><span class="build-stamp">build __BUILD__</span></div>
  </aside>
