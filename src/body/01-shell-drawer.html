<div class="app" id="app">
  <!-- The weather, behind everything and touchable by nothing. One pane: a
       light and a track are alternatives, not layers. See 31-vfx.css. -->
  <div class="vfx" id="vfx" aria-hidden="true"></div>
  <!-- **Fractal noise, because a nebula is not a shape.** Every soft thing in
       this app until now was a radial gradient, and a radial gradient is an
       ellipse however faint you make it — which is why the first pass at deep
       space came out as bubbles. What a real emission nebula looks like is
       filaments and torn edges and dark lanes cut through the middle, and
       nothing in CSS draws that. feTurbulence does, and `feDisplacementMap`
       pushes an ordinary gradient around by it.

       Three seeds so the clouds are not repeats of each other, and applied only
       to elements whose animation is a transform, so the filter is evaluated
       once and the result is composited from then on. See the nebula section of
       31-vfx.css. -->
  <svg class="vfx-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <!-- **The region is the cost.** A filter region is the area the whole
           chain is computed over, and these were 180% square on elements that
           are already inset -34%: about nine times the screen, turbulence and
           a blur over every pixel of it. On a phone that is twenty-odd million
           pixels of noise for a cloud behind a countdown, and it is the reason
           Deep space dropped frames after the scaling was taken out of the
           keyframes. The displacement moves a pixel by at most half its
           `scale`, so the margin only has to cover that. -->
      <filter id="vfx-neb" x="-14%" y="-14%" width="128%" height="128%"
              color-interpolation-filters="sRGB">
        <!-- Two octaves, not four. Each one is another pass over every
             pixel, and the ones past the second are finer than the blur that
             runs after them: the cost is real and the detail is thrown away
             two filter steps later. Going from four to two is what this costs
             now, and from arm's length behind a countdown the cloud is the
             same cloud. -->
        <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.011"
                      numOctaves="2" seed="17" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="230"
                           xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="vfx-neb2" x="-12%" y="-12%" width="124%" height="124%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014"
                      numOctaves="2" seed="52" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="150"
                           xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <filter id="vfx-neb3" x="-12%" y="-12%" width="124%" height="124%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.013 0.008"
                      numOctaves="2" seed="91" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="118"
                           xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="3"/>
      </filter>
    </defs>
  </svg>
  <!-- The dial's outer glow, kept out of the layout so nothing can clip it.
       Positioned onto the dial by glowFit() in 39-dial-glow.js. -->
  <div class="dial-glow" id="dial-glow" aria-hidden="true"></div>

  <!-- Beach's sea. Two layers of crests that slide, inside a frame that does
       not — which is the whole reason this is real markup rather than the two
       pseudo-elements it used to be.

       A `mask-image` belongs to the element it is written on, so it is carried
       along by that element's `transform`. With the crests and the mask on the
       same box, the horizon drifted upward with the water all cycle and then
       snapped back to the top: the loop was seamless in the waves and violently
       not in the fade over them, which reads as a video looping. Splitting them
       fixes it outright — the frame holds the mask and never moves, the children
       hold the crests and never carry a mask. -->
  <div class="beach-sea" aria-hidden="true">
    <i class="beach-wave beach-wave-far"></i>
    <i class="beach-wave beach-wave-mid"></i>
    <i class="beach-wave beach-wave-near"></i>
    <!-- Where it lands. One band, not a third wave; see 30-embers.css. -->
    <i class="beach-wave-foam"></i>
  </div>

  <!-- Beach's palms. App-level for the same reason as the webs below: they are
       the room, not any one screen.

       **One element per tree.** They were a single wide SVG with
       `preserveAspectRatio="slice"`, and on a wide screen slice scales to cover
       the width — so a 1900px-wide, 100px-tall band showed about a tenth of its
       own viewBox and the trees were cropped to stumps. That is what "broken on
       larger screens" was, and no amount of moving the band fixes it. Each tree
       now carries its own tightly-fitted viewBox and its own place, so nothing
       is ever cropped at any size and there is no cap on how many there are.

       Placed by hand rather than by a loop: sparse means uneven, and a loop
       makes a rhythm however much jitter you pour into it. Four, between 66%
       and 83% up the screen, sized by how far back they stand. Fewer and
       higher than they were — at seven they had stopped being scenery and
       become a hedge along the middle of the window.

       Blurred cheaply — a static `filter: blur()` is rasterised once, unlike
       `backdrop-filter`, which recomputes every frame over whatever moves
       beneath it (§6). -->
  <div class="beach-palms" aria-hidden="true">

  <!-- The Spiders look's corner webs. App-level rather than inside the timer, because
       they are the corners of the room and not part of any one screen; hidden
       outright under every other light.

       **Two different webs, not one drawn twice.** They were the same path
       mirrored, which is fine until you notice it — and a mirrored pair is
       exactly the thing an eye does notice, because nothing in a room is its
       own reflection. The right-hand one is a separate drawing from a separate
       seed with six strands and three rings against the left's seven and four.
       The CSS still flips it, but only to anchor it to its own corner.

       Deliberately uneven. The first version was seven evenly spaced strands of
       equal length with evenly sagging rings, which is a doily — real webs are
       built by an animal working in the dark and every span in them is slightly
       off. So the spoke angles and lengths are jittered, each ring's radius
       wanders from vertex to vertex, the sag varies per span, and two of the
       rings stop a strand short instead of closing. Generated from a seeded
       jitter, not typed, so it is reproducible and not a doodle. -->
    

<!-- **One web, spun twice.** These were torn: jittered spokes, rings
       that gave up part-way, holes, loose ends. Close up that is what a
       real web looks like; at 190px in the corner of a window it read as
       damage rather than as a web, and two different seeds meant the two
       corners did not even look like the same object.

       So: one clean orb. Eight spokes spread evenly across the quarter,
       six rings that go the whole way round, and every segment sagging
       8.5% toward the corner because a strand hangs between its anchors
       rather than running straight. The jitter that is left is about a
       degree of angle and three per cent of radius -- enough that it is
       not drawn with a compass, little enough that it is still tidy.

       Both corners carry the same path and the right one is mirrored in
       CSS, so there is one drawing to change and the pair match. -->
<svg class="corner-web corner-web-l" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
