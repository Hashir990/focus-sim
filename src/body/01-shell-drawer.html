  <!-- Beach's sea. Two layers of crests that slide, inside a frame that does
       not — which is the whole reason this is real markup rather than the two
       pseudo-elements it used to be.

       A `mask-image` belongs to the element it is written on, so it is carried
       along by that element's `transform`. With the crests and the mask on the
       same box, the horizon drifted upward with the water all cycle and then
       snapped back to the top: the loop was seamless in the waves and violently
       not in the fade over them, which reads as a video looping. Splitting them
       fixes it outright — the frame holds the mask and never moves, the children
       hold the crests and never carry a mask. -->
  <div class="beach-sea" aria-hidden="true">
    <i class="beach-wave beach-wave-far"></i>
    <i class="beach-wave beach-wave-near"></i>
  </div>

  <!-- Beach's palms. App-level for the same reason as the webs below: they are
       the room, not any one screen.

       **One element per tree.** They were a single wide SVG with
       `preserveAspectRatio="slice"`, and on a wide screen slice scales to cover
       the width — so a 1900px-wide, 100px-tall band showed about a tenth of its
       own viewBox and the trees were cropped to stumps. That is what "broken on
       larger screens" was, and no amount of moving the band fixes it. Each tree
       now carries its own tightly-fitted viewBox and its own place, so nothing
       is ever cropped at any size and there is no cap on how many there are.

       Placed by hand rather than by a loop: sparse means uneven, and a loop
       makes a rhythm however much jitter you pour into it. Four, between 66%
       and 83% up the screen, sized by how far back they stand. Fewer and
       higher than they were — at seven they had stopped being scenery and
       become a hedge along the middle of the window.

       Blurred cheaply — a static `filter: blur()` is rasterised once, unlike
       `backdrop-filter`, which recomputes every frame over whatever moves
       beneath it (§6). -->

  <!-- Spider-Man's corner webs. App-level rather than inside the timer, because
       they are the corners of the room and not part of any one screen; hidden
       outright under every other light.

       **Two different webs, not one drawn twice.** They were the same path
       mirrored, which is fine until you notice it — and a mirrored pair is
       exactly the thing an eye does notice, because nothing in a room is its
       own reflection. The right-hand one is a separate drawing from a separate
       seed with six strands and three rings against the left's seven and four.
       The CSS still flips it, but only to anchor it to its own corner.

       Deliberately uneven. The first version was seven evenly spaced strands of
       equal length with evenly sagging rings, which is a doily — real webs are
       built by an animal working in the dark and every span in them is slightly
       off. So the spoke angles and lengths are jittered, each ring's radius
       wanders from vertex to vertex, the sag varies per span, and two of the
       rings stop a strand short instead of closing. Generated from a seeded
       jitter, not typed, so it is reproducible and not a doodle. -->
