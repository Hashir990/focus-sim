    <!-- crossword -->
    <div class="game hide" id="game-crossword">
      <div class="game-top">
        <span class="gname">Crossword</span>
        <span class="meta" id="cw-meta"></span>
        <!-- Days in a row, painted by `dailyStreakPaint` in 09b-daily.js.
             Hidden at zero: a streak of none is not a thing to announce. -->
        <span class="streak hide" id="cw-streak"></span>
        <button class="mini-btn on" id="cw-dir" title="Switch typing direction (space)">Across →</button>
        <button class="mini-btn" id="cw-list">History</button>
      </div>

      <div class="cw-bars">
        <div class="diffs" id="cw-size"></div>
        <div class="cw-aids">
          <button class="mini-btn" id="cw-hint" title="Reveal this letter">Hint</button>
          <span class="cw-hints" id="cw-hints"></span>
          <button class="mini-btn" id="cw-check">Check</button>
        </div>
      </div>

      <div class="cw" id="cw-grid" translate="no"></div>
      <!-- The clue, with a way through the clues either side of it. Tab and
           shift-Tab have always done this; on a phone there is no Tab, and the
           only way to reach the next clue was to find its square. -->
      <div class="cw-clue-bar">
        <button class="cw-arrow" id="cw-prev" aria-label="Previous clue" title="Previous clue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <p class="cw-clue" id="cw-clue" translate="no">Pick a square to start</p>
        <button class="cw-arrow" id="cw-next" aria-label="Next clue" title="Next clue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="kbd cw-kbd" id="cw-kbd"></div>
      <div class="cw-clues" id="cw-clues"></div>
      <!-- What happens when you put it down. People close a puzzle and wonder,
           and the answer is good news, so it should not be a secret. -->
      <p class="game-note">Letters are kept as you go. Close it while you are signed in and the grid goes with you to your other devices.</p>

      <!-- pick a puzzle. Hold one to start it over. -->
      <div class="banner hide" id="cw-banner"><h3>Filled in.</h3><p id="cw-win-sub"></p><button class="mini-btn" id="cw-again">Next</button></div>
    </div>
