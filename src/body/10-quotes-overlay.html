<!-- ============ QUOTES OVERLAY ============ -->
<div class="overlay hide" id="quotes-overlay">
  <div class="ov-head">
    <button class="ov-back" id="q-back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="ov-title">Quote bank</div>
    <div style="width:40px"></div>
  </div>
  <div class="ov-body">
    <p class="q-intro">These show while you focus. Add your own below.</p>
    <div class="q-add">
      <textarea id="q-text" rows="2" placeholder="Your quote"></textarea>
      <input id="q-author" type="text" placeholder="Who said it (optional)" />
      <button class="primary" id="q-save" style="height:46px;border-radius:12px;font-size:14px">Add to bank</button>
    </div>
    <label class="q-share">
      <input type="checkbox" id="q-share" />
      <span>
        <b>Share these in a room</b>
        Shown to everyone, saved to nobody.
      </span>
    </label>

    <!-- The packs you have bought, each opening onto its own lines. Filled by
         renderQuotePacks() in 16-quotes-ui.js; the shop half is in Your focus.
         Only the quote lists inside are marked translate="no" — a pack's name
         and the line describing it are the app's words and are translated. -->
    <div id="q-packs"></div>

    <!-- **A drawer, like the packs above it.** This was a flat list, so a
         bank with forty quotes in it was forty quotes between you and anything
         below, and the packs — which are the same thing, bought rather than
         typed — were one line each. The same shape for both, and the count on
         the front answers the only question a closed drawer raises. -->
    <details class="q-pack q-mine" id="q-mine">
      <summary>
        <span class="q-pack-name"><b>Your quotes</b><em id="q-mine-n"></em></span>
      </summary>
      <div class="q-list" id="q-list"></div>
    </details>
    <div id="q-lent"></div>
  </div>
</div>
