    <!-- ============ SETUP ============ -->
    <section class="view" id="setup">
      <div class="lede">
        <h1>Set the rhythm<br>of your session.</h1>
        <p>Pick how long to focus, then how long to recover. Every fourth focus earns a long rest.</p>
      </div>

      <div class="field">
        <div class="flabel"><span>Focus for</span><span class="tag">deep work</span></div>
        <div class="stepper">
          <button class="step-btn" id="f-minus" aria-label="Less focus time">−</button>
          <div class="step-val"><span class="num" id="f-num">25</span><span class="unit">minutes</span></div>
          <button class="step-btn" id="f-plus" aria-label="More focus time">+</button>
        </div>
        <div class="presets" id="f-presets"></div>
      </div>

      <details class="drop" id="drop-rest">
        <summary>
          <span class="drop-name">Rest &amp; repeat</span>
          <span class="drop-val" id="rest-summary">5 min · ×4</span>
        </summary>
        <div class="drop-body">
          <div class="stepper">
            <button class="step-btn" id="r-minus" aria-label="Less rest time">−</button>
            <div class="step-val"><span class="num" id="r-num">5</span><span class="unit">minutes</span></div>
            <button class="step-btn" id="r-plus" aria-label="More rest time">+</button>
          </div>
          <div class="presets" id="r-presets"></div>
          <div class="rep-row">
            <span class="rep-lbl">Repeat</span>
            <div class="rep-chips" id="rep-chips"></div>
          </div>
        </div>
      </details>

      <details class="drop" id="drop-tasks">
        <summary>
          <span class="drop-name">Tasks</span>
          <span class="drop-val" id="task-summary">None yet</span>
        </summary>
        <div class="drop-body">
          <div class="task-add">
            <input id="task-input" class="task-field" type="text" maxlength="90" placeholder="What will you work on?" autocomplete="off" />
            <button class="mini-btn" id="task-add">Add</button>
          </div>
          <div class="task-list" id="task-list-setup"></div>
          <button class="task-clear hide" id="task-clear">Clear done</button>
        </div>
      </details>

      <button class="primary begin-btn" id="begin">Begin focus</button>
    </section>
